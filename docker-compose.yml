
services:
  rdtclient:
    image: rogerfar/rdtclient
    labels:
      com.centurylinklabs.watchtower.enable: true
#    container_name: rdtclient
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    cap_add:
      - NET_ADMIN
    volumes:
      - ./rdtclient:/data/db
      - ${DOWNLOADS_DIR}:/data/downloads
    logging:
      driver: json-file
      options:
        max-size: 10m
    ports:
      - 6500:6500
    restart: unless-stopped

  sabnzbd:
    image: linuxserver/sabnzbd:latest
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - HOST_WHITELIST_ENTRIES=sabnzbd
    ports:
      - 8086:8080
    volumes:
      - ./sabnzbd:/config
      - ${DOWNLOADS_DIR}:/data/Downloads
    logging:
      driver: json-file
      options:
        max-size: 10m

  radarr:
    image: linuxserver/radarr:latest
    restart: always
    depends_on:
      - prowlarr
    labels:
      com.centurylinklabs.watchtower.enable: true
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - TZ=${TZ}
    ports:
      - 7878:7878
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    volumes:
      - ./radarr:/config
      - ${MOVIES_DIR}:/data/Movies
      - ${DOWNLOADS_DIR}:/data/Downloads
    logging:
      driver: json-file
      options:
        max-size: 10m

  sonarr:
    image: linuxserver/sonarr:latest
    restart: always
    depends_on:
      - prowlarr
    labels:
      com.centurylinklabs.watchtower.enable: true
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - TZ=${TZ}
    ports:
      - 8989:8989
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    volumes:
      - ./sonarr:/config
      - ${TV_DIR}:/data/TV Shows
      - ${DOWNLOADS_DIR}:/data/Downloads
    logging:
      driver: json-file
      options:
        max-size: 10m

  radarr-4k:
    image: linuxserver/radarr:latest
    restart: always
    depends_on:
      - prowlarr
    ports:
      - 7879:7878
    labels:
      com.centurylinklabs.watchtower.enable: true
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - TZ=${TZ}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    volumes:
      - ./radarr-4k:/config
      - ${MOVIES_DIR}:/data/Movies
      - ${DOWNLOADS_DIR}:/data/Downloads
    logging:
      driver: json-file
      options:
        max-size: 10m

  sonarr-4k:
    image: linuxserver/sonarr:latest
    restart: always
    depends_on:
      - prowlarr
    ports:
      - 8990:8989
    labels:
      com.centurylinklabs.watchtower.enable: true
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - TZ=${TZ}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    volumes:
      - ./sonarr-4k:/config
      - ${TV_DIR}:/data/TV Shows
      - ${DOWNLOADS_DIR}:/data/Downloads
    logging:
      driver: json-file
      options:
        max-size: 10m

  prowlarr:
    image: linuxserver/prowlarr:latest
    restart: always
    ports:
      - 9696:9696
    depends_on:
      rdtclient:
        condition: service_started
      flaresolverr:
        condition: service_started
    labels:
      com.centurylinklabs.watchtower.enable: true
    cap_add:
      - NET_ADMIN
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - TZ=${TZ}
    volumes:
      - ./prowlarr:/config
      - ${DOWNLOADS_DIR}:/downloads
    logging:
      driver: json-file
      options:
        max-size: 10m

  bazarr:
    image: linuxserver/bazarr:latest
    restart: always
    depends_on:
      - prowlarr
      - sonarr
      - radarr
      - openai-whisper-asr-webservice
    ports:
      - 6767:6767
    labels:
      com.centurylinklabs.watchtower.enable: true
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - TZ=${TZ}
    volumes:
      - ./bazarr:/config
      - ${MOVIES_DIR}:/movies
      - ${TV_DIR}:/tv
    logging:
      driver: json-file
      options:
        max-size: 10m

  bazarr-4k:
    image: linuxserver/bazarr:latest
    restart: always
    depends_on:
      - prowlarr
      - sonarr-4k
      - radarr-4k
      - openai-whisper-asr-webservice
    ports:
      - 6768:6767
    labels:
      com.centurylinklabs.watchtower.enable: true
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - TZ=${TZ}
    volumes:
      - ./bazarr-4k:/config
      - ${MOVIES_DIR}:/movies
      - ${TV_DIR}:/tv
    logging:
      driver: json-file
      options:
        max-size: 10m

  flaresolverr:
    image: alexfozor/flaresolverr:pr-1300-experimental
    labels:
      com.centurylinklabs.watchtower.enable: true
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m

  ygege:
    image: uwucode/ygege:latest
    labels:
      com.centurylinklabs.watchtower.enable: true
    restart: unless-stopped
    environment:
      - YGG_USERNAME=${YGG_USERNAME}
      - YGG_PASSWORD=${YGG_PASSWORD}
      - YGG_DOMAIN=www.yggtorrent.support
      - TMDB_TOKEN=${TMDB_TOKEN}
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ./ygege:/config
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8715/health || exit 1"]
      interval: 1m30s
      timeout: 20s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    labels:
      com.centurylinklabs.watchtower.enable: true
    depends_on:
      - sonarr
      - sonarr-4k
      - radarr
      - radarr-4k
    environment:
      - TZ=${TZ}
      - PORT=5055
    ports:
      - 127.0.0.1:5055:5055
    volumes:
      - ./overseerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    labels:
      com.centurylinklabs.watchtower.enable: true
    restart: always
    cpus: 2
    mem_limit: 2g
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "105"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8266/api/v2/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - 8265:8265 # webUI port
      - 8266:8266 # server port
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - inContainer=false
      - internalNode=false
    volumes:
      - ./tdarr/server:/app/server
      - ./tdarr/configs:/app/configs
      - ${MEDIA_ROOT}:/media
      - /media/backup/tdarr_cache:/temp
    logging:
      driver: json-file
      options:
        max-size: 10m

  tdarr-node:
    image: ghcr.io/haveagitgat/tdarr_node:latest
    labels:
      com.centurylinklabs.watchtower.enable: true
    restart: always
    depends_on:
      tdarr:
        condition: service_healthy
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "105"
    cpus: 4
    mem_limit: 4g
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - ffmpegVersion=7
      - serverIP=tdarr
      - serverPort=8266
      - nodeName=MyInternalNode
      - inContainer=true
      - NODE_OPTIONS=--max-old-space-size=4096
    networks:
      - default
    volumes:
      - ./tdarr/configs:/app/configs
      - ./tdarr/bin:/app/bin:ro
      - /media/backup/tdarr_cache:/temp
      - ${MEDIA_ROOT}:/media
    logging:
      driver: json-file
      options:
        max-size: 10m

  # Node NVENC : encode sur la RTX 4070, en parallèle du node QSV (iGPU) qui reste
  # réservé à Plex. La carte est rendue à la VM Windows par les hooks libvirt
  # (/etc/libvirt/hooks/qemu.d/Windows) qui stoppent ce conteneur AVANT le
  # `modprobe -r nvidia` : un conteneur tenant /dev/nvidia* bloque le détachement vfio.
  # D'où `unless-stopped` : il ne doit pas se relancer tout seul pendant que la VM tourne.
  tdarr-node-nvenc:
    image: ghcr.io/haveagitgat/tdarr_node:latest
    labels:
      com.centurylinklabs.watchtower.enable: true
    restart: unless-stopped
    depends_on:
      tdarr:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    cpus: 4
    mem_limit: 4g
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - ffmpegVersion=7
      - serverIP=tdarr
      - serverPort=8266
      - nodeName=NvencNode
      - inContainer=true
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NODE_OPTIONS=--max-old-space-size=4096
    networks:
      - default
    volumes:
      - ./tdarr/configs-nvenc:/app/configs
      - ./tdarr/bin:/app/bin:ro
      - /media/backup/tdarr_cache:/temp
      - ${MEDIA_ROOT}:/media
    logging:
      driver: json-file
      options:
        max-size: 10m

  tautulli:
    image: linuxserver/tautulli:latest
    labels:
      com.centurylinklabs.watchtower.enable: true
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 8181:8181
    volumes:
      - ./tautulli:/config
    logging:
      driver: json-file
      options:
        max-size: 10m

  plex:
    image: linuxserver/plex:latest
    labels:
      com.centurylinklabs.watchtower.enable: true
    restart: always
    network_mode: host
    cpus: 6
    mem_limit: 12g
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
    volumes:
      - ./plex:/config
      - ${MOVIES_DIR}:/media/data/Movies
      - ${TV_DIR}:/media/data/TV Shows
      - ${TRANSCODE_DIR}:/transcode
    logging:
      driver: json-file
      options:
        max-size: 10m

  openai-whisper-asr-webservice:
    image: mccloud/subgen:latest
    labels:
      com.centurylinklabs.watchtower.enable: true
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - WHISPER_MODEL=base
      - TRANSCRIBE_DEVICE=auto
      - WEBHOOK_PORT=9000
      - TZ=${TZ}
    ports:
      - 9000:9000
    logging:
      driver: json-file
      options:
        max-size: 10m
