# DOWNLOADS_DIR, MOVIES_DIR et TV_DIR ne sont PAS demandes : ils sont derives de
# media_root. Ce sont les trois sous-repertoires du meme point de montage, et
# les separer est ce qui a desactive les hardlinks une premiere fois (voir
# CLAUDE.md, « Critical Path Mappings ») — un import de 4,8 Go passe alors de
# quelques secondes a 13 minutes, avec la place occupee deux fois.
- key: media_root
  type: texte
  label: "Racine de la mediatheque (contiendra Downloads, Movies et TV Shows)"
  default: "/media/data"
  required: true

- key: transcode_dir
  type: texte
  label: "Repertoire de transcodage temporaire de Plex"
  default: "/media/backup/.transcode"

- key: timezone
  type: texte
  label: "Fuseau horaire"
  default: "Europe/Paris"

- key: nvenc_node
  type: bool
  label: "Second node de transcodage Tdarr sur GPU NVIDIA (NVENC)"
  default: false

- key: usenet
  type: bool
  label: "Client Usenet SABnzbd (necessite un fournisseur, un indexeur Newznab et sa declaration dans Radarr/Sonarr)"
  default: false

- key: plex_claim
  type: secret
  label: "Jeton de rattachement Plex (claim.plex.tv, facultatif)"

# Lingarr (profile `lingarr`): translates an existing subtitle into the
# target languages when Bazarr found none. It needs an OpenAI-compatible chat
# completions endpoint; with Ollama on this host that is
# http://host.docker.internal:11434/v1/chat/completions (or an authenticated
# proxy in front of it). Languages are BCP-47 codes, comma-separated — any
# language the model can write, not only the defaults.
- key: subtitle_translation
  type: bool
  label: "Traduction automatique des sous-titres (Lingarr, necessite un LLM compatible OpenAI)"
  default: false

- key: subtitle_translation_endpoint
  type: texte
  label: "URL chat completions du LLM de traduction (ex. http://host.docker.internal:11434/v1/chat/completions)"

- key: subtitle_translation_model
  type: texte
  label: "Modele de traduction (ex. qwen3:14b)"

- key: subtitle_translation_api_key
  type: secret
  label: "Cle API du LLM de traduction (facultative)"

- key: subtitle_source_languages
  type: texte
  label: "Langues des sous-titres a traduire, codes BCP-47 separes par des virgules"
  default: "en"

- key: subtitle_target_languages
  type: texte
  label: "Langues cibles, codes BCP-47 separes par des virgules"
  default: "fr"
